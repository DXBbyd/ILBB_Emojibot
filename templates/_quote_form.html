<!-- 名言图合成表单：合成大类 → 子选项「名言图」 -->
<!-- 版式：JPG 输出 · 随机背景 + 90% 黑色蒙版 · 左侧方形圆角头像 · 右侧笑死气泡 · 右下角「—— 署名」 -->
<div class="main-panel">
    <!-- 左侧控制面板 -->
    <div class="control-panel">
        <div class="panel-title">名言图合成</div>
        <div class="panel-sub">
            随机背景 + 黑色蒙版，左侧方形圆角头像，右侧笑死气泡里放文字或表情包，
            右下角署名。自动调字号，表情包自适应（支持动图），输出 JPG。
        </div>

        <!-- 头像 / 署名来源 -->
        <div class="form-group">
            <label>QQ号（取头像和昵称做署名）</label>
            <div style="display:flex;gap:8px;">
                <input type="text" id="quoteQQ" placeholder="例如：3157037483" maxlength="11"
                       pattern="\d*" style="flex:1;">
                <button type="button" class="btn-ghost" id="quoteFetchQQ">获取头像</button>
            </div>
            <div class="meme-qq-status hidden" id="quoteQQStatus"></div>
        </div>

        <div class="form-group">
            <label>署名（显示在右下角，默认「—— 昵称」）</label>
            <input type="text" id="quoteName" placeholder="留空则用昵称 / 配置里的默认署名" maxlength="20">
        </div>

        <!-- 气泡内容：文字 / 表情包 -->
        <div class="form-group">
            <label>气泡内容</label>
            <div class="quote-seg" id="quoteSeg">
                <button type="button" class="quote-seg-btn active" data-qmode="text">文字</button>
                <button type="button" class="quote-seg-btn" data-qmode="image">表情包</button>
            </div>

            <div id="quoteModeText">
                <textarea id="quoteText" rows="4" placeholder="写点什么，比如：这就是名言。"
                          style="width:100%;padding:10px 14px;border:2px solid #e8ecf2;border-radius:10px;
                                 font-size:14px;outline:none;background:#fafbfc;resize:vertical;
                                 font-family:inherit;transition:all 0.25s;"></textarea>
                <div style="font-size:12px;color:#b0b4c0;margin-top:6px;">
                    字太多会自动缩小字号，装不下才截断。
                </div>
            </div>

            <div id="quoteModeImage" class="hidden">
                <label class="quote-drop" id="quoteDrop">
                    <input type="file" id="quoteImgInput" accept="image/*" hidden>
                    <span id="quoteDropLabel">点击选择表情包（支持 GIF 动图）</span>
                </label>
                <div style="font-size:12px;color:#b0b4c0;margin-top:6px;">
                    只取第一张，按气泡宽度自适应缩放；动图自动取首帧。
                </div>
            </div>
        </div>

        <!-- 背景 -->
        <div class="form-group">
            <label>背景</label>
            <div class="bg-type-row" id="quoteBgRow">
                <button type="button" class="bg-type active" data-qbg="random">随机图</button>
                <button type="button" class="bg-type" data-qbg="upload">自定义图</button>
                <button type="button" class="bg-type" data-qbg="none">纯黑底</button>
            </div>
            <div class="bg-editor hidden" id="quoteBgUpload">
                <label class="bg-upload">
                    <input type="file" id="quoteBgInput" accept="image/*" hidden>
                    <span id="quoteBgLabel">选择背景图片</span>
                </label>
            </div>
        </div>

        <button id="quoteGenerateBtn" class="btn-primary">生成名言图</button>

        <div id="quoteLoading" class="loading-bar hidden">
            <div class="spinner"></div>
            <span>正在合成名言图...</span>
        </div>

        <button id="quoteDownloadBtn" class="btn-download hidden">下载 JPG</button>

        <div id="quoteMeta" class="user-info-preview hidden">
            <div class="info-row">
                <span class="label">署名</span>
                <span class="value" id="quoteMetaName">-</span>
            </div>
            <div class="info-row">
                <span class="label">背景</span>
                <span class="value" id="quoteMetaBg">-</span>
            </div>
            <div class="info-row">
                <span class="label">气泡</span>
                <span class="value" id="quoteMetaBubble">-</span>
            </div>
        </div>
    </div>

    <!-- 右侧预览面板 -->
    <div class="preview-panel">
        <span class="preview-label">预览</span>

        <div id="quotePlaceholder" class="preview-placeholder">
            <span class="icon">＋</span>
            点击「生成名言图」<br>
            <span style="font-size:13px;color:#d0d4de;">名言图会在这里预览（JPG）</span>
        </div>

        <div id="quotePreviewWrap" style="display:none;width:100%;max-width:340px;">
            <img id="quotePreviewImg" src="" alt="名言图预览"
                 style="width:100%;max-height:520px;object-fit:contain;border-radius:16px;
                        box-shadow:0 12px 32px rgba(0,0,0,0.18);">
            <div style="text-align:center;margin-top:12px;font-size:13px;color:#8c8f9c;"
                 id="quotePreviewTip">名言图预览</div>
        </div>
    </div>
</div>
