<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILBB Emoji Bot</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.jpg') }}" type="image/jpeg">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#eceff4; min-height:100vh; position:relative; overflow-x:hidden; }

/* 动态渐变背景光斑 */
body::before, body::after {
  content:""; position:fixed; z-index:0; border-radius:50%; filter:blur(70px); pointer-events:none;
}
body::before { width:500px;height:500px; left:-120px; top:-120px; background:rgba(45,122,255,.18); animation:floatOrb 14s ease-in-out infinite; }
body::after { width:420px;height:420px; right:-100px; bottom:-100px; background:rgba(122,92,255,.16); animation:floatOrb 18s ease-in-out infinite reverse; }
@keyframes floatOrb { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,30px) scale(1.15);} }
.sidebar,.main-area,.auth-card { position:relative; z-index:1; }

/* 通用 Q 弹动效 */
@keyframes popIn { 0%{opacity:0; transform:translateY(16px) scale(.96);} 60%{opacity:1; transform:translateY(-3px) scale(1.015);} 100%{opacity:1; transform:translateY(0) scale(1);} }
@keyframes cardIn { 0%{opacity:0; transform:translateY(14px) scale(.97);} 60%{opacity:1; transform:translateY(-2px) scale(1.008);} 100%{opacity:1; transform:translateY(0) scale(1);} }
@keyframes rowIn { 0%{opacity:0; transform:translateX(-8px);} 100%{opacity:1; transform:translateX(0);} }
@keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
@keyframes spin { to{transform:rotate(360deg);} }

/* 加载骨架屏 */
.skeleton-bar { height:14px; border-radius:7px; margin:10px 0; background:linear-gradient(90deg,#eef1f6 25%,#dfe4ec 37%,#eef1f6 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
.skeleton-bar.sb-title{width:40%;height:12px;} .skeleton-bar.sb-hint{width:60%;height:12px;}
.skeleton-bar.sb-lg{height:18px;}
.loading-line { display:flex; align-items:center; gap:14px; padding:12px 0; }
.spinner { width:20px; height:20px; border:3px solid rgba(45,122,255,.2); border-top-color:#2d7aff; border-radius:50%; animation:spin .9s linear infinite; flex-shrink:0; }
.spinner.sm{width:14px;height:14px;border-width:2px;}

/* 接口调用统计 */
.usage-card { grid-column:1 / -1; }
.usage-overview { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.usage-metric { background:rgba(45,122,255,.06); border:1px solid rgba(45,122,255,.12); border-radius:12px; padding:14px 16px; transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
.usage-metric:hover { transform:translateY(-3px) scale(1.02); }
.usage-metric .num { font-size:24px; font-weight:700; color:#1a1a2e; line-height:1.1; }
.usage-metric .lab { font-size:12px; color:#8c8f9c; margin-top:4px; }
.usage-cols { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
.usage-block { min-width:0; }
.usage-block h4 { font-size:13px; color:#8c8f9c; margin-bottom:10px; font-weight:600; }
.usage-table { width:100%; border-collapse:collapse; }
.usage-table th { text-align:left; font-size:11px; color:#8c8f9c; font-weight:600; padding:6px 8px; border-bottom:1px solid #eef0f4; }
.usage-table td { padding:7px 8px; font-size:12px; color:#1a1a2e; border-bottom:1px solid rgba(0,0,0,.04); }
.usage-table tr:last-child td{border-bottom:none;}
.usage-table .route-cell { font-family:monospace; font-size:11px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.usage-table .count-cell { font-weight:700; }
.meter { display:inline-block; height:8px; width:70px; border-radius:4px; background:#eef1f6; overflow:hidden; vertical-align:middle; margin-left:6px; }
.meter span { display:block; height:100%; background:linear-gradient(90deg,#2d7aff,#5a6bff); border-radius:4px; }
.meter.ok span{background:linear-gradient(90deg,#34c759,#4cd964);}
.recent-list { max-height:300px; overflow-y:auto; }
.recent-item { display:flex; justify-content:space-between; align-items:center; padding:7px 8px; font-size:12px; border-bottom:1px solid rgba(0,0,0,.04); animation:rowIn .3s ease both; }
.recent-item:last-child{border-bottom:none;}
.recent-item .rmethod { font-family:monospace; font-weight:700; font-size:11px; }
.recent-item .rroute { font-family:monospace; color:#5b6b88; flex:1; margin:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.recent-item .rstatus { font-weight:700; font-size:11px; }
.rstatus.good{color:#2e7d32;} .rstatus.bad{color:#c62828;}
.tag-method { font-family:monospace; font-size:10px; padding:1px 6px; border-radius:5px; background:#e8edf5; color:#4a6a8b; }

/* 接口测试 */
.ep-list { display:flex; flex-direction:column; gap:12px; }
.ep-card { background:rgba(255,255,255,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.75); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.05); overflow:hidden; animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) both; }
.ep-head { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; transition:background .2s, transform .2s; }
.ep-head:hover { background:rgba(45,122,255,.05); }
.ep-card.open .ep-head { background:rgba(45,122,255,.05); }
.ep-method { font-family:monospace; font-size:11px; padding:3px 10px; border-radius:7px; font-weight:700; flex-shrink:0; }
.meth-GET{background:#e8f5e9;color:#2e7d32;} .meth-POST{background:#e8f0fe;color:#2d7aff;} .meth-PUT{background:#fff3e0;color:#e65100;} .meth-DELETE{background:#ffebee;color:#c62828;}
.ep-path { font-family:monospace; font-size:13px; color:#1a1a2e; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ep-sum { flex:1; font-size:12px; color:#8c8f9c; text-align:right; }
.ep-arrow { color:#b0b4c0; transition:transform .3s; flex-shrink:0; }
.ep-card.open .ep-arrow { transform:rotate(180deg); }
.ep-body { padding:0 18px 18px; display:none; }
.ep-card.open .ep-body { display:block; animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both; }
.ep-field-label { font-size:12px; color:#5b6b88; margin:12px 0 6px; font-weight:600; }
.ep-input { width:100%; padding:10px 12px; border:2px solid #e8ecf2; border-radius:10px; font-family:monospace; font-size:12px; outline:none; background:rgba(255,255,255,.92); resize:vertical; transition:border .2s, box-shadow .2s; color:#26324a; }
.ep-input:focus { border-color:#2d7aff; box-shadow:0 0 0 3px rgba(45,122,255,.1); }
.ep-textarea { font-family:monospace; }
.ep-queryline { display:flex; align-items:center; gap:8px; }
.ep-queryline span { font-size:12px; color:#8c8f9c; font-family:monospace; }
.ep-actions { display:flex; gap:12px; margin-top:14px; align-items:center; flex-wrap:wrap; }
.ep-run { padding:9px 24px; background:linear-gradient(135deg,#2d7aff,#5a6bff); color:#fff; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(45,122,255,.25); transition:all .25s cubic-bezier(.34,1.56,.64,1); }
.ep-run:hover { transform:translateY(-2px) scale(1.03); box-shadow:0 8px 20px rgba(45,122,255,.35); }
.ep-run:active { transform:scale(.95); }
.pipe-hint { font-size:12px; font-family:monospace; }
.pipe-hint.good { color:#2e7d32; } .pipe-hint.bad { color:#c62828; } .pipe-hint.running { color:#8c8f9c; }
.ep-result { background:rgba(15,20,30,.04); border:1px solid #eef0f4; border-radius:10px; padding:12px; margin-top:12px; font-family:monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; color:#26324a; max-height:380px; overflow:auto; line-height:1.6; }

/* 登录/设置 */
.auth-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.auth-card { background:rgba(255,255,255,.8); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-radius:20px; padding:40px 36px; width:380px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.1), 0 0 0 1px rgba(255,255,255,.6) inset; border:1px solid rgba(255,255,255,.7); animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
.auth-card h1 { font-size:22px; color:#1a1a2e; margin-bottom:6px; }
.auth-card p.sub { font-size:13px; color:#8c8f9c; margin-bottom:24px; }
.auth-card input { width:100%; padding:12px 16px; border:2px solid #e8ecf2; border-radius:12px; font-size:15px; outline:none; margin-bottom:14px; transition:all .25s cubic-bezier(.34,1.56,.64,1); background:rgba(255,255,255,.85); }
.auth-card input:focus { border-color:#2d7aff; box-shadow:0 0 0 4px rgba(45,122,255,.1); transform:scale(1.01); }
.auth-card button { width:100%; padding:13px; background:linear-gradient(135deg,#2d7aff,#5a6bff); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 6px 16px rgba(45,122,255,.3); }
.auth-card button:hover { transform:translateY(-2px) scale(1.02); box-shadow:0 10px 24px rgba(45,122,255,.4); }
.auth-card button:active { transform:scale(.96); }
.auth-err { color:#e05555; font-size:13px; margin-bottom:10px; min-height:18px; }
.auth-back { display:block; text-align:center; margin-top:16px; color:#8c8f9c; font-size:13px; text-decoration:none; }
.auth-back:hover { color:#2d7aff; }

/* 后台布局 */
.admin-layout { display:flex; min-height:100vh; }
.sidebar { flex:0 0 220px; background:linear-gradient(180deg,rgba(26,26,46,.97),rgba(32,38,64,.96)); backdrop-filter:blur(10px); padding:24px 0; display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.06); }
.sidebar .brand { font-size:18px; font-weight:700; color:#fff; padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,.08); letter-spacing:.5px; }
.sidebar .nav-item { padding:13px 24px; color:rgba(255,255,255,.6); cursor:pointer; font-size:14px; font-weight:500; transition:all .25s cubic-bezier(.34,1.56,.64,1); border-left:3px solid transparent; }
.sidebar .nav-item:hover { color:#fff; background:rgba(255,255,255,.05); transform:translateX(3px); }
.sidebar .nav-item.active { color:#fff; background:rgba(45,122,255,.18); border-left-color:#2d7aff; }
.sidebar .nav-spacer { flex:1; }
.sidebar .nav-item.logout { color:rgba(255,255,255,.4); font-size:13px; }
.main-area { flex:1; padding:32px; overflow-y:auto; animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both; }
.main-area h2 { font-size:20px; color:#1a1a2e; margin-bottom:20px; animation:rowIn .4s ease both; }

/* 状态卡片 */
.status-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.status-card { background:rgba(255,255,255,.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:16px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04); border:1px solid rgba(255,255,255,.75); animation:cardIn .5s cubic-bezier(.34,1.56,.64,1) both; transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
.status-card:hover { transform:translateY(-4px); box-shadow:0 16px 36px rgba(0,0,0,.09); }
.status-card:nth-child(1){animation-delay:.03s;} .status-card:nth-child(2){animation-delay:.07s;} .status-card:nth-child(3){animation-delay:.11s;}
.status-card:nth-child(4){animation-delay:.15s;} .status-card:nth-child(5){animation-delay:.19s;} .status-card:nth-child(6){animation-delay:.23s;}
.status-card h3 { font-size:14px; color:#8c8f9c; margin-bottom:14px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.status-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px; border-bottom:1px solid rgba(0,0,0,.05); animation:rowIn .4s ease both; }
.status-row:nth-child(2){animation-delay:.05s;} .status-row:nth-child(3){animation-delay:.1s;} .status-row:nth-child(4){animation-delay:.15s;} .status-row:nth-child(5){animation-delay:.2s;} .status-row:nth-child(6){animation-delay:.25s;}
.status-row:last-child { border-bottom:none; }
.status-row .k { color:#5b6b88; }
.status-row .v { color:#1a1a2e; font-weight:500; }
.badge-ok { background:#e8f5e9; color:#2e7d32; padding:2px 10px; border-radius:10px; font-size:12px; }
.badge-err { background:#ffebee; color:#c62828; padding:2px 10px; border-radius:10px; font-size:12px; }

/* API Key */
.key-toolbar { display:flex; gap:10px; margin-bottom:20px; align-items:center; flex-wrap:wrap; animation:rowIn .4s ease both; }
.key-toolbar input { padding:10px 14px; border:2px solid #e8ecf2; border-radius:10px; font-size:14px; outline:none; flex:1; min-width:200px; background:rgba(255,255,255,.85); transition:all .25s cubic-bezier(.34,1.56,.64,1); }
.key-toolbar input:focus { border-color:#2d7aff; box-shadow:0 0 0 3px rgba(45,122,255,.1); }
.key-toolbar button { padding:10px 20px; background:linear-gradient(135deg,#2d7aff,#5a6bff); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 4px 12px rgba(45,122,255,.25); }
.key-toolbar button:hover { transform:translateY(-2px) scale(1.03); box-shadow:0 8px 20px rgba(45,122,255,.35); }
.key-toolbar button:active { transform:scale(.95); }
.key-toolbar button.secondary { background:#e8edf5; color:#4a6a8b; box-shadow:none; }
.key-table { width:100%; background:rgba(255,255,255,.86); backdrop-filter:blur(10px); border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.05); border:1px solid rgba(255,255,255,.75); border-collapse:collapse; animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
.key-table th { background:rgba(250,250,252,.9); padding:12px 16px; text-align:left; font-size:12px; color:#8c8f9c; font-weight:600; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid #eef0f4; }
.key-table td { padding:12px 16px; font-size:13px; color:#1a1a2e; border-bottom:1px solid rgba(0,0,0,.04); transition:background .2s ease; }
.key-table tbody tr { animation:rowIn .4s ease both; }
.key-table tbody tr:nth-child(1){animation-delay:.02s;} .key-table tbody tr:nth-child(2){animation-delay:.06s;} .key-table tbody tr:nth-child(3){animation-delay:.1s;} .key-table tbody tr:nth-child(4){animation-delay:.14s;} .key-table tbody tr:nth-child(5){animation-delay:.18s;}
.key-table tbody tr:hover { background:rgba(45,122,255,.04); }
.key-table tr:last-child td { border-bottom:none; }
.key-cell { font-family:monospace; font-size:12px; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.key-actions { display:flex; gap:8px; }
.key-actions button { padding:5px 12px; border:none; border-radius:8px; font-size:12px; cursor:pointer; font-weight:500; transition:all .25s cubic-bezier(.34,1.56,.64,1); }
.btn-toggle-on { background:#e8f5e9; color:#2e7d32; }
.btn-toggle-off { background:#fff3e0; color:#e65100; }
.btn-delete { background:#ffebee; color:#c62828; }
.key-actions button:active { transform:scale(.9); }
.key-actions button:hover { opacity:.85; transform:translateY(-1px); }
.empty-state { text-align:center; padding:40px; color:#8c8f9c; font-size:14px; animation:rowIn .4s ease both; }
.new-key-banner { background:rgba(232,245,233,.9); border:1px solid #c8e6c9; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 8px 20px rgba(46,125,50,.08); animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
.new-key-banner .label { font-size:12px; color:#2e7d32; font-weight:600; margin-bottom:4px; }
.new-key-banner .val { font-family:monospace; font-size:14px; color:#1a1a2e; word-break:break-all; }
.new-key-banner .hint { font-size:12px; color:#8c8f9c; margin-top:6px; }
.hidden { display:none; }
</style>
</head>
<body>

<!-- 登录 / 设置 -->
<div class="auth-wrap hidden" id="authView">
  <div class="auth-card">
    <h1 id="authTitle">管理后台</h1>
    <p class="sub" id="authSub">请输入管理密码登录</p>
    <div class="auth-err" id="authErr"></div>
    <input type="password" id="authPwd" placeholder="管理密码" autofocus>
    <button id="authBtn">登录</button>
    <a href="/" class="auth-back">← 返回主页</a>
  </div>
</div>

<!-- 后台主体 -->
<div class="admin-layout hidden" id="adminView">
  <div class="sidebar">
    <div class="brand">管理后台</div>
    <div class="nav-item active" data-tab="status">状态检查</div>
    <div class="nav-item" data-tab="usage">接口统计</div>
    <div class="nav-item" data-tab="keys">API Key 管理</div>
    <div class="nav-spacer"></div>
    <div class="nav-item logout" id="logoutBtn">退出登录</div>
  </div>
  <div class="main-area">
    <!-- 状态 -->
    <div id="tab-status">
      <h2>状态检查</h2>
      <div id="statusContent"><p class="empty-state">加载中...</p></div>
      <h2 style="margin-top:34px">接口测试</h2>
      <div id="endpointsBlock"><p class="empty-state">加载中...</p></div>
    </div>
    <!-- 接口统计 -->
    <div id="tab-usage" class="hidden">
      <h2>接口统计</h2>
      <div id="usageContent"><p class="empty-state">加载中...</p></div>
    </div>
    <!-- API Key -->
    <div id="tab-keys" class="hidden">
      <h2>API Key 管理</h2>
      <div id="newKeyWrap" class="hidden"></div>
      <div class="key-toolbar">
        <input type="text" id="newKeyName" placeholder="Key 名称（可选）">
        <button id="createKeyBtn">创建 Key</button>
        <button id="refreshKeysBtn" style="background:#e8edf5;color:#4a6a8b;">刷新</button>
      </div>
      <div id="keysContent"><p class="empty-state">加载中...</p></div>
    </div>
  </div>
</div>

<script>
var authView=document.getElementById('authView');
var adminView=document.getElementById('adminView');
var authTitle=document.getElementById('authTitle');
var authSub=document.getElementById('authSub');
var authErr=document.getElementById('authErr');
var authPwd=document.getElementById('authPwd');
var authBtn=document.getElementById('authBtn');
var hasPassword=false;

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function checkSession(){
  fetch('/admin/api/session').then(function(r){return r.json();}).then(function(d){
    hasPassword=d.has_password;
    if(d.logged_in){
      showAdmin();
    }else{
      showAuth();
    }
  });
}

function showAuth(){
  authView.classList.remove('hidden');
  adminView.classList.add('hidden');
  if(!hasPassword){
    authTitle.textContent='设置管理密码';
    authSub.textContent='首次使用，请设置管理密码';
    authBtn.textContent='设置密码并登录';
  }else{
    authTitle.textContent='管理后台';
    authSub.textContent='请输入管理密码登录';
    authBtn.textContent='登录';
  }
}

function showAdmin(){
  authView.classList.add('hidden');
  adminView.classList.remove('hidden');
  LAST_LOADED.status=false; LAST_LOADED.usage=false; LAST_LOADED.keys=false;
  loadStatus();
  loadEndpoints();
}

authBtn.addEventListener('click',function(){
  var pwd=authPwd.value.trim();
  if(!pwd){authErr.textContent='请输入密码';return;}
  var url=hasPassword?'/admin/api/login':'/admin/api/setup';
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){authErr.textContent=d.error;return;}
      authErr.textContent='';authPwd.value='';
      showAdmin();
    })
    .catch(function(){authErr.textContent='网络错误';});
});
authPwd.addEventListener('keydown',function(e){if(e.key==='Enter')authBtn.click();});

document.getElementById('logoutBtn').addEventListener('click',function(){
  fetch('/admin/api/logout',{method:'POST'}).then(function(){location.reload();});
});

// 侧栏切换
var LAST_LOADED = {};
document.querySelectorAll('.sidebar .nav-item[data-tab]').forEach(function(item){
  item.addEventListener('click',function(){
    document.querySelectorAll('.sidebar .nav-item[data-tab]').forEach(function(n){n.classList.remove('active');});
    item.classList.add('active');
    var tab=item.getAttribute('data-tab');
    document.getElementById('tab-status').classList.toggle('hidden',tab!=='status');
    document.getElementById('tab-usage').classList.toggle('hidden',tab!=='usage');
    document.getElementById('tab-keys').classList.toggle('hidden',tab!=='keys');
    if(tab==='status'){ if(!LAST_LOADED.status)loadStatus(); loadEndpoints(); }
    if(tab==='usage'){ if(!LAST_LOADED.usage)loadUsage(); }
    if(tab==='keys'){ if(!LAST_LOADED.keys)loadKeys(); }
  });
});

// 状态骨架屏：先弹卡片 + 转圈，数据到位后再填充
function skeletonCard(count, wide){
  var w = wide?'style="grid-column:1/-1"':'';
  var h='<div class="status-card" '+w+'><h3><span class="skeleton-bar sb-hint" style="margin:0"></span></h3>';
  for(var i=0;i<count;i++){
    h+='<div class="loading-line"><div class="spinner sm"></div><div class="skeleton-bar sb-title" style="flex:1;margin:0"></div></div>';
  }
  h+='</div>';
  return h;
}

function loadStatus(){
  var c=document.getElementById('statusContent');
  // 先渲染骨架（卡片先带动画弹出）
  c.innerHTML='<div class="status-grid">'
    + skeletonCard(6) + skeletonCard(4) + skeletonCard(2)
    + skeletonCard(2) + skeletonCard(3) + skeletonCard(3)
    + '<div class="status-card" style="grid-column:1/-1"><h3><span class="skeleton-bar sb-hint" style="margin:0"></span></h3><div class="loading-line"><div class="spinner sm"></div><div class="skeleton-bar" style="flex:1;margin:0"></div></div><div class="loading-line"><div class="spinner sm"></div><div class="skeleton-bar" style="flex:1;margin:0"></div></div></div>'
    + '</div>';
  fetch('/api/status').then(function(r){return r.json();}).then(function(d){
    if(d&&d.ok===false){throw new Error(d.error||'状态异常');}
    renderStatus(d);
  }).catch(function(e){c.innerHTML='<p class="empty-state">获取失败：'+esc(e.message)+'</p>';});
}

function badge(ok,txt){return '<span class="'+(ok?'badge-ok':'badge-err')+'">'+esc(txt||(ok?'正常':'异常'))+'</span>';}

function secTo(sec){
  if(sec===undefined||sec===null)return '—';
  if(sec<60)return Math.floor(sec)+' 秒';
  if(sec<3600)return (sec/60).toFixed(1)+' 分钟';
  return (sec/3600).toFixed(1)+' 小时';
}

function renderStatus(d){
  var s=d.server||{};var m=d.meme||{};var c=d.cache||{};var qq=d.qq_api||{};
  var dirs = Array.isArray(d.dirs)?d.dirs:[];
  var fontFiles = d.fonts&&Array.isArray(d.fonts.files)?d.fonts.files:[];
  var now = d.datetime||s.started_at||'';
  var host = s.host||('127.0.0.1:5000');
  var h='<div class="status-grid">';
  h+='<div class="status-card"><h3>服务器</h3>';
  [['监听地址',host],['Debug 模式',s.debug?'开':'关'],['Python',s.python],['启动时间',s.started_at],['运行时长',secTo(s.uptime_sec)],['当前时间',now]].forEach(function(r){
    h+='<div class="status-row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(String(r[1]!==undefined?r[1]:'—'))+'</span></div>';
  });
  h+='</div>';
  h+='<div class="status-card"><h3>Meme 服务</h3>';
  [['总表情数',m.total],['需/支持图片',m.with_image],['纯文字',m.no_image],['预览可用',m.preview_ok?'是':'否']].forEach(function(r){
    h+='<div class="status-row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(String(r[1]!==undefined?r[1]:'—'))+'</span></div>';
  });
  if(m.error)h+='<div class="status-row"><span class="k">错误</span><span class="v">'+esc(m.error)+'</span></div>';
  h+='</div>';
  h+='<div class="status-card"><h3>缓存</h3>';
  [['文件数',c.count],['大小',c.size_kb?c.size_kb.toFixed(1)+' KB':'—']].forEach(function(r){
    h+='<div class="status-row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(String(r[1]))+'</span></div>';
  });
  if(c.error)h+='<div class="status-row"><span class="k">错误</span><span class="v">'+esc(c.error)+'</span></div>';
  h+='</div>';
  h+='<div class="status-card"><h3>QQ 接口</h3>';
  h+='<div class="status-row"><span class="k">连通性</span><span class="v">'+badge(qq.reachable,qq.reachable?'可达':'不可达')+'</span></div>';
  if(qq.http)h+='<div class="status-row"><span class="k">HTTP 状态</span><span class="v">'+esc(String(qq.http))+'</span></div>';
  if(qq.error)h+='<div class="status-row"><span class="k">错误</span><span class="v">'+esc(qq.error)+'</span></div>';
  h+='</div>';
  h+='<div class="status-card"><h3>目录权限</h3>';
  if(!dirs.length){
    h+='<div class="status-row"><span class="k">无数据</span><span class="v">-</span></div>';
  }else{
    dirs.forEach(function(v){
      if(!v)return;
      h+='<div class="status-row"><span class="k">'+esc(v.name||'')+'</span><span class="v">'+(v.exists?badge(v.writable,'可写'):badge(false,'不存在'))+'</span></div>';
    });
  }
  h+='</div>';
  h+='<div class="status-card"><h3>字体 ('+fontFiles.length+')</h3>';
  if(!fontFiles.length){
    h+='<div class="status-row"><span class="k">无可用字体</span><span class="v">-</span></div>';
  }else{
    fontFiles.forEach(function(f){
      h+='<div class="status-row"><span class="k">'+esc(f)+'</span><span class="v">✓</span></div>';
    });
  }
  h+='</div></div>';

  document.getElementById('statusContent').innerHTML=h;
}

function loadUsage(){
  var c=document.getElementById('usageContent');
  c.innerHTML='<div class="status-grid">'+skeletonCard(1) +'</div>';
  fetch('/api/status').then(function(r){return r.json();}).then(function(d){
    if(d&&d.ok===false){throw new Error(d.error||'状态异常');}
    c.innerHTML=renderUsage(d.usage||{});
    LAST_LOADED.usage=true;
  }).catch(function(e){c.innerHTML='<p class="empty-state">获取失败：'+esc(e.message)+'</p>';});
}

function renderUsage(u){
  var routes = u.by_route||[];
  var recent = u.recent||[];
  var maxCount = routes.length?routes[0].count:0;
  var h='<div class="status-card usage-card"><h3>接口调用统计</h3>';
  h+='<div class="usage-overview">';
  [['接口调用',esc(String(u.api_total||0))],['成功率',(u.success_rate!==undefined?u.success_rate+'%':'—')],
   ['平均速率',u.rate_per_sec!==undefined?u.rate_per_sec+'/s':'—'],['运行时长',secTo(u.uptime_sec)]].forEach(function(m){
    h+='<div class="usage-metric"><div class="num">'+m[1]+'</div><div class="lab">'+m[0]+'</div></div>';
  });
  h+='</div>';

  h+='<div class="usage-cols">';
  // 按接口排行
  h+='<div class="usage-block"><h4>按接口排行</h4>';
  if(!routes.length){
    h+='<div class="empty-state" style="padding:16px">暂无接口调用</div>';
  }else{
    h+='<table class="usage-table"><thead><tr><th>接口</th><th>调用</th><th>成功</th><th>失败</th><th>成功率</th><th>平均耗时</th></tr></thead><tbody>';
    routes.forEach(function(r){
      var pct=Math.round(100*r.count/maxCount);
      var sr=r.count?(100*r.ok/r.count).toFixed(0):'0';
      h+='<tr><td class="route-cell" title="'+esc(r.route)+'">'+esc(r.route)+'<span class="meter'+(r.fail===0?' ok':'')+'" title="'+pct+'%"><span style="width:'+pct+'%"></span></span></td>'
        +'<td class="count-cell">'+esc(String(r.count))+'</td><td>'+esc(String(r.ok))+'</td><td>'+(r.fail?'<span style="color:#c62828">'+esc(String(r.fail))+'</span>':'<span style="color:#8c8f9c">0</span>')+'</td>'
        +'<td>'+sr+'%</td><td>'+(r.avg_ms!==undefined?esc(String(r.avg_ms))+'ms':'—')+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  // 最近调用
  h+='<div class="usage-block"><h4>最近调用</h4>';
  if(!recent.length){
    h+='<div class="empty-state" style="padding:16px">暂无调用记录</div>';
  }else{
    h+='<div class="recent-list">';
    recent.forEach(function(r){
      var cls=r.status<400?'good':'bad';
      h+='<div class="recent-item"><span class="rmethod">'+esc(r.method)+'</span><span class="rroute" title="'+esc(r.route)+'">'+esc(r.route)+'</span><span>'+esc(String(r.ms))+'ms</span><span class="rstatus '+cls+'">'+esc(String(r.status))+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  h+='</div></div>';
  return h;
}

// ===== 接口测试 =====
var ENDPOINTS = [];

function loadEndpoints(){
  var box=document.getElementById('endpointsBlock');
  fetch('/admin/api/endpoints').then(function(r){return r.json();}).then(function(d){
    ENDPOINTS=d.endpoints||[];
    renderEndpoints();
  }).catch(function(){box.innerHTML='<p class="empty-state">加载失败</p>';});
}

function methodClass(m){var c=m.toUpperCase(); if(c==='GET')return'meth-GET';if(c==='POST')return'meth-POST';if(c==='PUT')return'meth-PUT';if(c==='DELETE')return'meth-DELETE';return'meth-GET';}

function renderEndpoints(){
  var box=document.getElementById('endpointsBlock');
  if(!ENDPOINTS.length){box.innerHTML='<p class="empty-state">暂无接口</p>';return;}
  var h='<div class="ep-list">';
  ENDPOINTS.forEach(function(ep,i){
    var m=ep.method.toUpperCase();
    h+='<div class="ep-card" id="ep-'+i+'"><div class="ep-head" onclick="toggleEp('+i+')">'
      +'<span class="ep-method '+methodClass(m)+'">'+esc(m)+'</span>'
      +'<span class="ep-path">'+esc(ep.path)+'</span>'
      +'<span class="ep-sum">'+esc(ep.summary||'')+'</span>'
      +'<span class="ep-arrow">▾</span></div>';
    h+='<div class="ep-body">';
    if(ep.needKey){
      h+='<div class="ep-field-label">Authorization: Bearer (可选，留空则走未鉴权)</div>'
        +'<input class="ep-input" id="k-'+i+'" placeholder="sk-..." style="font-weight:normal">';
    }
    if(m==='POST'){
      h+='<div class="ep-field-label">请求体 JSON</div>'
        +'<textarea class="ep-input" id="b-'+i+'" rows="'+Math.max(3,(JSON.stringify(ep.body||{}).length/40)+1)+'">'+esc(JSON.stringify(ep.body||{},null,2))+'</textarea>';
      if(ep.needFile){
        h+='<div class="ep-field-label">上传图片（自动写入 image 字段，base64）</div>'
          +'<input type="file" accept="image/*" id="f-'+i+'" onchange="onEpFile('+i+',this)">';
      }
    }else{
      h+='<div class="ep-field-label">Query 参数（'+(ep.needKey?'需 Bearer':'无需鉴权')+'）</div>'
        +'<div class="ep-queryline"><span>?</span><input class="ep-input" id="q-'+i+'" value="'+esc(ep.query||'')+'" placeholder="key=value&..."></div>';
    }
    h+='<div class="ep-actions"><button class="ep-run" onclick="runEp('+i+')">测试调用</button>'
      +'<span class="pipe-hint" id="st-'+i+'"></span></div>'
      +'<div id="r-'+i+'"></div>';
    h+='</div></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}

function toggleEp(i){
  var el=document.getElementById('ep-'+i);
  el.classList.toggle('open');
}

window.onEpFile=function(i,input){
  var f=input.files&&input.files[0]; if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var body=document.getElementById('b-'+i);
    try{var obj=JSON.parse(body.value||'{}');}catch(err){obj={};}
    obj.image=e.target.result;
    body.value=JSON.stringify(obj,null,2);
  };
  reader.readAsDataURL(f);
};

window.runEp=function(i){
  var ep=ENDPOINTS[i];
  var st=document.getElementById('st-'+i);
  var rbox=document.getElementById('r-'+i);
  var headers={};
  if(ep.needKey){
    var k=document.getElementById('k-'+i).value.trim();
    if(k){headers['Authorization']='Bearer '+k;}
  }
  var url=ep.path, opts={method:ep.method, headers:headers}, t0=Date.now();
  if(ep.method==='POST'){
    var bodyText=document.getElementById('b-'+i).value.trim();
    var payload=bodyText?bodyText:'{}';
    // 兼容前端构造的多行/注释
    headers['Content-Type']='application/json';
    opts.body=payload;
  }else{
    var q=document.getElementById('q-'+i).value.trim().replace(/^[?#]/,'');
    if(q)url+='?'+q;
  }
  st.textContent='请求中...'; st.className='pipe-hint running';
  rbox.innerHTML='<div class="loading-line"><div class="spinner sm"></div><span style="color:#8c8f9c;font-size:12px">调用中...</span></div>';
  fetch(url,opts).then(function(resp){
    var ct=resp.headers.get('Content-Type')||'';
    return Promise.all([Promise.resolve(resp),Promise.resolve(ct),resp.blob()]);
  }).then(function(arr){
    var resp=arr[0],ct=arr[1],blob=arr[2];
    var ms=Date.now()-t0;
    st.textContent='HTTP '+resp.status+' · '+ms+'ms';
    st.className=resp.status<400?'pipe-hint good':'pipe-hint bad';
    if(ct.indexOf('image/')===0){
      var url=URL.createObjectURL(blob);
      rbox.innerHTML='<div class="ep-result"><img src="'+url+'" style="max-width:320px;border-radius:12px;border:1px solid #eef0f4"></div>';
    }else{
      return blob.text().then(function(txt){
        var pretty=txt;
        try{pretty=JSON.stringify(JSON.parse(txt),null,2);}catch(e){pretty=txt.slice(0,3000);}
        rbox.innerHTML='<pre class="ep-result">'+esc(pretty)+'</pre>';
      });
    }
  }).catch(function(e){
    st.textContent='请求失败'; st.className='pipe-hint bad';
    rbox.innerHTML='<pre class="ep-result">'+esc(String(e.message||e))+'</pre>';
  });
};

// API Key
function loadKeys(){
  var c=document.getElementById('keysContent');
  c.innerHTML='<p class="empty-state">加载中...</p>';
  fetch('/admin/api/keys').then(function(r){return r.json();}).then(function(d){
    renderKeys(d.keys||[]);
  }).catch(function(){c.innerHTML='<p class="empty-state">获取失败</p>';});
}

function fmtTime(ts){
  if(!ts)return '—';
  var d=new Date(ts*1000);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function renderKeys(keys){
  var c=document.getElementById('keysContent');
  if(!keys.length){c.innerHTML='<p class="empty-state">暂无 API Key，点击上方「创建 Key」生成</p>';return;}
  var h='<table class="key-table"><thead><tr><th>名称</th><th>Key</th><th>状态</th><th>创建时间</th><th>最后使用</th><th>操作</th></tr></thead><tbody>';
  keys.forEach(function(k){
    h+='<tr>';
    h+='<td>'+esc(k.name||'未命名')+'</td>';
    h+='<td class="key-cell" title="'+esc(k.key)+'">'+esc(k.key)+'</td>';
    h+='<td>'+(k.enabled?'<span class="badge-ok">启用</span>':'<span class="badge-err">禁用</span>')+'</td>';
    h+='<td>'+fmtTime(k.created)+'</td>';
    h+='<td>'+fmtTime(k.last_used)+'</td>';
    h+='<td><div class="key-actions">';
    h+='<button class="'+(k.enabled?'btn-toggle-off':'btn-toggle-on')+'" onclick="toggleKey(\''+k.key+'\')">'+(k.enabled?'禁用':'启用')+'</button>';
    h+='<button class="btn-delete" onclick="deleteKey(\''+k.key+'\')">删除</button>';
    h+='</div></td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  c.innerHTML=h;
}

window.toggleKey=function(key){
  fetch('/admin/api/keys/'+encodeURIComponent(key)+'/toggle',{method:'POST'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){alert(d.error);return;}
    loadKeys();
  });
};

window.deleteKey=function(key){
  if(!confirm('确定删除此 API Key？此操作不可撤销。'))return;
  fetch('/admin/api/keys/'+encodeURIComponent(key),{method:'DELETE'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){alert(d.error);return;}
    loadKeys();
  });
};

document.getElementById('createKeyBtn').addEventListener('click',function(){
  var name=document.getElementById('newKeyName').value.trim();
  fetch('/admin/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){alert(d.error);return;}
      document.getElementById('newKeyName').value='';
      var w=document.getElementById('newKeyWrap');
      w.classList.remove('hidden');
      w.className='new-key-banner';
      w.innerHTML='<div class="label">新 Key 已创建（请立即复制保存）</div><div class="val">'+esc(d.key.key)+'</div><div class="hint">调用 /v1 接口时使用 Header：<code>Authorization: Bearer '+esc(d.key.key)+'</code></div>';
      loadKeys();
    });
});

document.getElementById('refreshKeysBtn').addEventListener('click',loadKeys);

// 启动
checkSession();
</script>
